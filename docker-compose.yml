services:
  db:
    image: postgres:15-alpine
    container_name: practices_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: practices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d practices_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
